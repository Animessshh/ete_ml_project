<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Indicator</title>
</head>

<body>

    <h1>Student Exam Performance Indicator</h1>

    <h2>Student Exam Performance Prediction</h2>

    <form action="{{ url_for('predict_datapoint') }}" method="post">

        <!-- Gender -->
        <label for="gender">Gender</label>
        <select id="gender" name="gender">
            <option value="">Select your Gender</option>
            <option value="female">female</option>
            <option value="male">male</option>
        </select>

        <br>

        <!-- Race / Ethnicity -->
        <label for="race_ethnicity">Race or Ethnicity</label>
        <select id="race_ethnicity" name="race_ethnicity">
            <option value="">Select Ethnicity</option>
            <option value="group A">group A</option>
            <option value="group B">group B</option>
            <option value="group C">group C</option>
            <option value="group D">group D</option>
            <option value="group E">group E</option>
        </select>

        <br>

        <!-- Parental Level of Education -->
        <label for="parental_level_of_education">
            Parental Level of Education
        </label>

        <select id="parental_level_of_education"
                name="parental_level_of_education">

            <option value="">Select Parent Education</option>
            <option value="bachelor's degree">bachelor's degree</option>
            <option value="some college">some college</option>
            <option value="master's degree">master's degree</option>
            <option value="associate's degree">associate's degree</option>
            <option value="high school">high school</option>
            <option value="some high school">some high school</option>

        </select>

        <br>

        <!-- Lunch -->
        <label for="lunch">Lunch Type</label>

        <select id="lunch" name="lunch">
            <option value="">Select Lunch Type</option>
            <option value="standard">standard</option>
            <option value="free/reduced">free/reduced</option>
        </select>

        <br>

        <!-- Test Preparation Course -->
        <label for="test_preparation_course">
            Test preparation course
        </label>

        <select id="test_preparation_course"
                name="test_preparation_course">

            <option value="">Select Test_Course</option>
            <option value="none">none</option>
            <option value="completed">completed</option>

        </select>

        <br>

        <!-- Writing Score -->
        <label for="writing_score">
            Writing Score out of 100
        </label>

        <input type="number"
               id="writing_score"
               name="writing_score"
               placeholder="Enter your score"
               min="0"
               max="100">

        <br>

        <!-- Reading Score -->
        <label for="reading_score">
            Reading Score out of 100
        </label>

        <input type="number"
               id="reading_score"
               name="reading_score"
               placeholder="Enter your score"
               min="0"
               max="100">

        <br>

        <button type="submit">
            Predict your Maths Score
        </button>

    </form>

    <h2>THE prediction is {{ results }}</h2>

</body>

</html>
